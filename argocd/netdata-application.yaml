apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasklane-netdata
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://netdata.github.io/helmchart/
    chart: netdata
    targetRevision: 3.7.171

    helm:
      valueFiles:
        - $values/monitoring/netdata-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
