apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklane-backend
  namespace: tasklane
spec:
  replicas: 1

  selector:
    matchLabels:
      app: tasklane-backend

  template:
    metadata:
      labels:
        app: tasklane-backend

    spec:
      containers:
        - name: backend

          image: 904325153322.dkr.ecr.ap-south-1.amazonaws.com/cloudtriad-tasklane-backend:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: tasklane-db-secret
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: tasklane-db-secret
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tasklane-db-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tasklane-db-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklane-db-secret
                  key: DB_PASSWORD

            - name: FLASK_ENV
              value: "production"

            - name: FLASK_DEBUG
              value: "false"

            - name: FLASK_RUN_HOST
              value: "0.0.0.0"

            - name: FLASK_RUN_PORT
              value: "5000"

            - name: CORS_ORIGINS
              value: "*"

          # Give the application enough time to start.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5

          # Determines whether the pod should receive traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # Determines whether Kubernetes should restart the container.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
