parent:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

  database:
    persistence: false

  alarms:
    persistence: false

replicaCount: 1

deploymentStrategy:
  type: Recreate

sd:
